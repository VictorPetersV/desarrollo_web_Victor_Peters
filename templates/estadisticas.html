<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>Gestión de Adopciones</h1>
    {% include 'navbar.html' %}
  </header>

  <main class="container">
    <section class="card">
      <h2>Estadísticas</h2>
      <p class="muted">Datos de ejemplo sobre los avisos registrados.</p>

        <div class="card" style="margin-bottom:5%;">
        <h4>Avisos por día</h4>
        <canvas id="lineChart" style="width:50%; height:50%;"></canvas>
        </div>

        <div class="card" style="margin-bottom:5%px;">
        <h4>Por tipo (gato vs perro)</h4>
        <canvas id="pieChart" style="width:50%; height:50%;"></canvas>
        </div>

        <div class="card">
        <h4>Avisos por mes (gato/perro)</h4>
        <canvas id="barChart" style="width:50%; height:50%;"></canvas>
        </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
>
  <script>
        // Los datos llegan directamente desde Flask
        const tipos = {{ tipos|tojson }};
        const cantidades_tipos = {{ cantidades_tipos|tojson }};
        const regiones = {{ regiones|tojson }};
        const cantidades_regiones = {{ cantidades_regiones|tojson }};
        const meses = {{ meses|tojson }};
        const cantidades_meses = {{ cantidades_meses|tojson }};

        // Llama a las funciones de app.js
        drawPie(document.getElementById('pieChart'), cantidades_tipos, tipos);
        drawBar(document.getElementById('barChart'), regiones, cantidades_regiones, []);
        drawLine(document.getElementById('lineChart'), meses, cantidades_meses);
  </script>
</body>
</html>
