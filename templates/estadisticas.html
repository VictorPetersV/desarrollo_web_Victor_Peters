<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>Gestión de Adopciones</h1>
    {% include 'navbar.html' %}
  </header>

  <main class="container">
    <section class="card">
      <h2>Estadísticas</h2>
      <p class="muted">Datos de ejemplo sobre los avisos registrados.</p>

        <div class="card" style="margin-bottom:20px;">
        <h4>Avisos por día</h4>
        <canvas id="lineChart" style="width:100%; height:300px;"></canvas>
        </div>

        <div class="card" style="margin-bottom:20px;">
        <h4>Por tipo (gato vs perro)</h4>
        <canvas id="pieChart" style="width:100%; height:300px;"></canvas>
        </div>

        <div class="card">
        <h4>Avisos por mes (gato/perro)</h4>
        <canvas id="barChart" style="width:100%; height:300px;"></canvas>
        </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    // Ajusta los canvas al tamaño de su contenedor
    function resizeCanvasToDisplaySize(canvas) {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        }
    }

    function drawChartsResponsive() {
        const lineCanvas = document.getElementById("lineChart");
        const pieCanvas = document.getElementById("pieChart");
        const barCanvas = document.getElementById("barChart");

        [lineCanvas, pieCanvas, barCanvas].forEach(resizeCanvasToDisplaySize);

        drawAllCharts();
    }

        // Dibujar al cargar
        window.addEventListener("load", drawChartsResponsive);

        // Redibujar al cambiar el tamaño de la ventana
        window.addEventListener("resize", drawChartsResponsive);
     </script>
</body>
</html>
