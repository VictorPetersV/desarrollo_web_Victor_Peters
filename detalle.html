<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Gestión de Adopciones</h1>
    <nav>
      <button onclick="location.href='inicio.html'">Inicio</button>
      <button onclick="location.href='agregar-aviso.html'">Agregar aviso</button>
      <button onclick="location.href='listado.html'">Listado</button>
      <button onclick="location.href='estadisticas.html'">Estadísticas</button>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <button class="btn btn-ghost" onclick="location.href='listado.html'">← Volver al listado</button>
      <button class="btn btn-ghost" onclick="location.href='inicio.html'">↩ Volver a inicio</button>

      <div id="detailContent" style="margin-top:12px"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script>
    // Obtener el parámetro "id" de la URL
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id"));

    if (id) {
      showDetail(id);
    } else {
      document.getElementById("detailContent").innerHTML =
        "<p class='muted'>⚠️ No se encontró el aviso solicitado.</p>";
    }
  </script>
</body>
</html>
